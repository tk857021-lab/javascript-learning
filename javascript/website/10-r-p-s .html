<!doctype html>
<html lang="en">
  <head>
    <title>rock paper scissors</title>
    <style>
      body{
        background-color: black;
      }
      .title-rps{
        color: white;
      }
      .js-score , .js-pick{
        color: white;
      }

      .move-icons{
        height: 50px; 
      }

      .move-button{
        border-radius: 60px;
        background-color: transparent;
        height: 120px;
        width: 120px;
        cursor: pointer;
        border: 3px solid white;
        margin-left: 10px;
      }

      .css-result{
        font-size: 25px;
        font-weight: bold;
        margin-top: 40px;
      }

      .reset-score-button{
        border: none;
        padding: 10px;
        margin-top: 25px;
      }
    </style>
  </head>
  <body>
    <p class="title-rps">rock paper scissors</p>
    <button onclick="playGame('rock')" class="move-button">
      <img src="rock-emoji.png" alt="rock" class="move-icons">
    </button>

    <button onclick="playGame('paper')" class="move-button">
      <img src="paper-emoji.png" alt="papar" class="move-icons">
    </button>

    <button onclick="playGame('scissors')" class="move-button">
      <img src="scissors-emoji.png" alt="scissors" class="move-icons">
    </button>

    <p class="js-result css-result"></p>
    <p class="js-pick"></p>
    <p class="js-score"></p>

    <button
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updateScoreElement();
        alert(
          `wins: ${score.wins} losses: ${score.losses} ties: ${score.ties}`,
        );
      " 
      class="reset-score-button"
    >
      restart score
    </button>
    <script>
      let score = JSON.parse(localStorage.getItem("score"))
      ||  {
          wins: 0,
          losses: 0,
          ties: 0,
        };
        
        updateScoreElement();
       /*
      if (score === null) {
        score = {
          wins: 0,
          losses: 0,
          ties: 0,
        };
      }*/

      function playGame(playerMove) {
        const computerMove = PickComputerMove();
        let result = "";

        if (playerMove === "scissors") {
          if (computerMove === "rock") {
            result = "you loss";
          } else if (computerMove === "paper") {
            result = "you win";
          } else if (computerMove === "scissors") {
            result = "tie";
          }
        } else if (playerMove === "rock") {
          if (computerMove === "rock") {
            result = "tie";
          } else if (computerMove === "paper") {
            result = "you loss";
          } else if (computerMove === "scissors") {
            result = "you win";
          }
        } else if (playerMove === "paper") {
          if (computerMove === "rock") {
            result = "you win";
          } else if (computerMove === "paper") {
            result = "you tie";
          } else if (computerMove === "scissors") {
            result = "you loss";
          }
        }

        if (result === "you win") {
          score.wins += 1;
        } else if (result === "you loss") {
          score.losses += 1;
        } else if (result === "you tie") {
          score.ties += 1;
        }

        localStorage.setItem("score", JSON.stringify(score));

        updateScoreElement();
        
         document.querySelector('.js-result')
        .innerHTML = result;

        
        document.querySelector('.js-pick')
        .innerHTML = `You picked 
           <img src="${playerMove}-emoji.png" class="move-icons"> 
           <img src="${computerMove}-emoji.png" class="move-icons">
           Computer picked`;

        alert(
          `You picked ${playerMove}. Computer picked ${computerMove}. ${result}
          wins: ${score.wins} losses: ${score.losses} ties: ${score.ties} `,
        );
      }

      function updateScoreElement(){
        
        document.querySelector('.js-score')
        .innerHTML = `wins: ${score.wins} losses: ${score.losses} ties: ${score.ties}`;
      };
      
      

      function PickComputerMove() {
        const randomNum = Math.random();

        let computerMove = "";

        if (randomNum >= 0 && randomNum < 1 / 3) {
          computerMove = "rock";
        } else if (randomNum >= 1 / 3 && randomNum < 2 / 3) {
          computerMove = "paper";
        } else if (randomNum >= 2 / 3 && randomNum < 1) {
          computerMove = "scissors";
        }

        return computerMove;
      }
    </script>
  </body>
</html>
