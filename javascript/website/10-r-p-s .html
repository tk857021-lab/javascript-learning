<!doctype html>
<html lang="en">
  <head>
    <title>rock paper scissors</title>
    <link rel="stylesheet" href="css/10-rps.css">
  
  </head>
  <body>
    <p class="title-rps">rock paper scissors</p>
    <button onclick="playGame('rock')" class="move-button">
      <img src="image/rock-emoji.png" alt="rock" class="move-icons">
    </button>

    <button onclick="playGame('paper')" class="move-button">
      <img src="image/paper-emoji.png" alt="papar" class="move-icons">
    </button>

    <button onclick="playGame('scissors')" class="move-button">
      <img src="image/scissors-emoji.png" alt="scissors" class="move-icons">
    </button>

    <p class="js-result css-result"></p>
    <p class="js-pick"></p>
    <p class="js-score"></p>

    <button
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updateScoreElement();
        alert(
          `wins: ${score.wins} losses: ${score.losses} ties: ${score.ties}`,
        );
      " 
      class="reset-score-button"
    >
      restart score
    </button>
    <script src="script/10-rps.js">
    </script>
  </body>
</html>
