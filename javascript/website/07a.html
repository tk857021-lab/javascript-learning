    function convertFahrenheth(celsius){
      console.log((celsius * 9/5)+32);
    }
    
    function convertCelsius(fahrenheth){
      console.log((fahrenheth-32)*5/9)
    }


    function converttemperature(degree,unit){
      if (unit === 'C'){
      
      console.log((degree-32)*5/9)
      }else if (unit=== 'F'){
        console.log((degree * 9/5)+32);
      }
    }
   converttemperature(25 ,'F')

   function convertLength(length,from,to){  
    if (from==='miles' && to === 'km'){
      console.log((length*1.6)*1);

    }else if (from==='km' && to === 'miles'){
      console.log((length*1)*1.6);

    }else if (from==='km' && to === 'km'){

    }else if (from==='miles' && to === 'miles'){
      console.log((length*1)*1);
    }else if (from==='miles' && to === 'ft'){
      console.log((length*1)*26400);
    }else if (from==='km' && to === 'ft'){
      console.log((length*1)*3281);

      console.log((length*26400)*1);

      console.log((length*3281)*1);
    }else if(!from=== 'ft' || 'miles' || 'km' && to === 'miles' ||  'km' || 'ft'){

    }

  }
