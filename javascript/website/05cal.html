<!DOCTYPE html>
<html lang="en">
  <head>
    <title>
        calculater
    </title>
  <style>
      
  </style>
  </head>
  <body>
    <P>
      <button onclick="num('1');">1</button>
      <button onclick="num('2');">2</button>
      <button onclick="num('3');">3</button>
      <button onclick="op(' * ');">*</button>
    </P>
    <p>
      <button onclick="num('4');">4</button>
      <button onclick="num('5');">5</button>
      <button onclick="num('6');">6</button>
      <button onclick="op(' - ');">-</button>
    </p>
    <p>
      <button onclick="num('7');">7</button>
      <button onclick="num('8');">8</button>
      <button onclick="num('9');">9</button>
      <button onclick="op(' * ');">*</button>
    </p>
    <p>
      <button onclick="num('0');">0</button>
      <button onclick="num('.');">.</button>
      <button onclick="caluation = eval(caluation);
       console.log(caluation);">=</button>
      <button onclick="op(' + ');">+</button>
    </p>
    <p>
      <button onclick="caluation = '';
       console.log('cleared');">clear</button>
    </p>
    <script>
      let caluation = '';

      function num(number){
       caluation += number;
       console.log(caluation);
      }
      function  op(oprater){
        caluation +=  oprater 
        console.log(caluation);
      }
    </script>
  </body>    
</html>
