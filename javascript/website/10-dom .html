  <body>

    <button onclick="
     const buttonElement9a = document.querySelector('.js-9a');

       }else {

       }; " class="js-9a" >9a</button>

    <input placeholder="name" onkeyup="whatKey(event.key)" 
    class="js-key-input">

    <script>


     function whatKey(event){
      const inputKey= document.querySelector('.js-key-input');
      let outputkey = inputKey.value;
      
      document.querySelector(".js-what-key").innerHTML = outputkey;
       
     }

     
      
     function yourName(){
      const inputElementName = document.querySelector('.js-name-input');
      let showName = inputElementName.value;
  
      document.querySelector(".js-what-name").innerHTML = `your name is: ${showName}`;
     }


      

     function handleKeyName(event) {
        if (event.key === "Enter") {
          yourName();
        }
      }


      String(25);
      console.log("20" - 5);
      console.log("20" + 5);

      window.document;
      window.console.log("window");
      window.alert;

      function handleKeyCost(event) {
        if (event.key === "Enter") {
          calculateTotal();

        }
      }

      function calculateTotal() {
        const inputElement = document.querySelector(".js-cost-input");
        let cost = Math.round(Number(inputElement.value));
        console.log(cost);
        console.log(typeof cost);

        if (cost < 40) {
          cost = cost + 10;
          console.log(cost);
        }

        document.querySelector(".js-total-cost").innerHTML = `$${cost}`;
      }

      function Subscribe() {
        const buttonElement = document.querySelector(".js-subscribe-button");
        if (buttonElement.innerHTML === "Subscribe") {
          buttonElement.innerHTML = "Subscribed";
          buttonElement.classList.add('is-subscribed');
        } else {
          buttonElement.innerHTML = "Subscribe";
          buttonElement.classList.remove('is-subscribed');
        }
      }


       
    </script>
