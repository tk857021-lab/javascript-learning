<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculator</title>
<link rel="stylesheet" href="css/10-cal.css">
</head>
<body>
<p class="js-cal-box cal-box-css"></p>
<p>
  <button onclick="num('1') , updateCalculation();" class="num">1</button>
  <button onclick="num('2') , updateCalculation(); " class="num">2</button>
  <button onclick="num('3') , updateCalculation();" class="num">3</button>
  <button onclick="op(' + ') , updateCalculation();" class="oprater">+</button>
</p>
<p>
  <button onclick="num('4') , updateCalculation();" class="num">4</button>
  <button onclick="num('5') , updateCalculation();" class="num">5</button>
  <button onclick="num('6') , updateCalculation();" class="num">6</button>
  <button onclick="op(' - ') , updateCalculation();" class="oprater">-</button>
</p>
<p>
  <button onclick="num('7') , updateCalculation();" class="num">7</button>
  <button onclick="num('8') , updateCalculation();" class="num">8</button>
  <button onclick="num('9') , updateCalculation();" class="num">9</button>
  <button onclick="op(' * ') , updateCalculation();" class="oprater">*</button>
</p>
<p>
  <button onclick="num('0') , updateCalculation();" class="num">0</button>
  <button onclick="num('.') , updateCalculation();" class="num">.</button>
  <button onclick="equals() , updateCalculation();" class="num">=</button>
  <button onclick="op(' / ') , updateCalculation();" class="oprater">/</button>
</p>
<p>
  <button onclick="clearAll() ,updateCalculation();" class="clear">clear</button>
</p>

<script src="script/10-cal.js">
</script>
</body>
</html>
